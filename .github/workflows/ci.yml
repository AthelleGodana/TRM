name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Web app (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  server:
    name: API (integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Same throwaway database as docker-compose.test.yml (see server/.env.test).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: transtrack_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transtrack_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  ai-fuel-service:
    name: AI fuel service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-fuel-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-fuel-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          AI_FUEL_SERVICE_SECRET: ci-only-test-secret-0123456789
