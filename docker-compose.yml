# Settings come from a .env file next to this file (see .env.example).
# No secrets are stored here.

services:
  postgres:
    image: postgres:15-alpine
    container_name: shuttle_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shuttle_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [default]

  # Express REST + Socket.IO API. On start it applies migrations and
  # (re)creates the application/system database roles.
  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-fuel-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shuttle_db}
      DATABASE_URL: postgresql://transtrack_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-shuttle_db}
      DATABASE_URL_SYSTEM: postgresql://transtrack_system:${DB_SYSTEM_PASSWORD:?Set DB_SYSTEM_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-shuttle_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      DEFAULT_ORG_ADMIN_EMAIL: ${DEFAULT_ORG_ADMIN_EMAIL:-}
      LEGACY_PASSWORD_LOGIN: ${LEGACY_PASSWORD_LOGIN:-false}
      # Demo sign-in; the API refuses to start with it on in production.
      DEV_LOGIN: ${DEV_LOGIN:-false}
      FUEL_ANALYTICS_PROVIDER: ${FUEL_ANALYTICS_PROVIDER:-null}
      AI_FUEL_SERVICE_URL: http://ai-fuel-service:8000
      AI_FUEL_SERVICE_SECRET: ${AI_FUEL_SERVICE_SECRET:?Set AI_FUEL_SERVICE_SECRET in .env}
      FUEL_ANALYSIS_JOB_ENABLED: ${FUEL_ANALYSIS_JOB_ENABLED:-false}
      FUEL_ANALYSIS_INTERVAL_MINUTES: ${FUEL_ANALYSIS_INTERVAL_MINUTES:-1440}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads:/srv/uploads
    ports:
      - "127.0.0.1:5000:5000"
    networks: [default, ai-internal]

  # Web app: the built client served by nginx with security headers, long
  # caching for hashed assets and gzip. Proxies /api and /socket.io to the
  # API. Open http://localhost:8080 (set CLIENT_URL to match).
  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default]

  # AI fuel analytics stub. Only on the internal network (no published
  # ports, no route to the database); the API is its only client and must
  # present the shared secret. docker-compose.dev.yml publishes it on
  # 127.0.0.1:8001 for local development.
  ai-fuel-service:
    build:
      context: ./ai-fuel-service
      target: runtime
    restart: unless-stopped
    environment:
      AI_FUEL_SERVICE_SECRET: ${AI_FUEL_SERVICE_SECRET:?Set AI_FUEL_SERVICE_SECRET in .env}
    networks: [ai-internal]

networks:
  default: {}
  ai-internal:
    internal: true

volumes:
  postgres_data:
  uploads:
