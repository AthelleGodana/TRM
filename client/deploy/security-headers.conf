# Included in every location that sets its own headers (nginx drops
# server-level add_header lines inside a location that has any).
#
# CSP: only our own origin plus what the app really uses:
#  - Google Identity Services (sign-in button and One Tap)
#  - Google Fonts
#  - OpenStreetMap tiles, Google profile photos
# style-src keeps 'unsafe-inline' because Leaflet, framer-motion and the
# Google button set inline styles; scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Sent only when served over HTTPS by a TLS-terminating proxy in front.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
